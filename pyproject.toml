[project]
name = "store-sale"
version = "0.1.0"
description = "Offline Persian single-store application — phase-zero prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0", "SQLAlchemy==2.1.4", "alembic==1.20.0",
  "Jinja2==3.1.6", "uvicorn==0.54.0", "argon2-cffi==25.1.0",
  "python-multipart==0.0.32", "tzdata==2026.5", "jdatetime==6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*.css"]
